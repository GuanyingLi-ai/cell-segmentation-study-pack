cpus: 2

files:
  data_dir: ./outputs/bidcell/work
  fp_dapi: ./data_raw/bidcell/morphology_mip_small.tif
  fp_transcripts: ./data_raw/bidcell/transcripts_small.csv
  fp_ref: ./data_raw/bidcell/sc_breast.csv
  fp_pos_markers: ./data_raw/bidcell/sc_breast_markers_pos.csv
  fp_neg_markers: ./data_raw/bidcell/sc_breast_markers_neg.csv

nuclei_fovs:
  stitch_nuclei_fovs: false

nuclei:
  diameter:

transcripts:
  shift_to_origin: true
  x_col: x_location
  y_col: y_location
  gene_col: feature_name
  transcripts_to_filter:
    - NegControlProbe_
    - antisense_
    - NegControlCodeword_
    - BLANK_
    - Blank-
    - NegPrb

affine:
  target_pix_um: 1.0
  base_pix_x: 0.2125
  base_pix_y: 0.2125
  base_ts_x: 1.0
  base_ts_y: 1.0
  global_shift_x: 0
  global_shift_y: 0

model_params:
  name: custom
  patch_size: 48
  elongated:
    - Endothelial
    - Fibroblasts
    - Myofibroblasts
    - SMC

training_params:
  total_epochs: 1
  total_steps: 60
  ne_weight: 1.0
  os_weight: 1.0
  cc_weight: 1.0
  ov_weight: 1.0
  pos_weight: 1.0
  neg_weight: 1.0

testing_params:
  test_epoch: 1
  test_step: 60

experiment_dirs:
  dir_id: last
